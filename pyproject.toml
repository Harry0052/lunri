[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunri"
version = "0.2.0"
description = "Compare an original prompt with a shorter one, and keep a local invoice benchmark. Mock mode needs no API key."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harry Malhi" }]
dependencies = []

[project.scripts]
lunri = "lunri.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunri = ["data/*.json", "data/*.jsonl", "data/invoices/*.txt", "data/invalid/*.jsonl", "data/prompts/*.txt"]
