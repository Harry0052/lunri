[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunri"
version = "0.2.0"
description = "Local invoice-text benchmark with a mock path, an Ollama adapter, and an optional Apple Silicon energy sample."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Harry Malhi" }]
dependencies = []

[project.scripts]
lunri = "lunri.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lunri = ["data/*.json", "data/*.jsonl", "data/invoices/*.txt"]
